    <title>Levantra Settings</title>

    <script>
        (function() {
            try {
                var theme = localStorage.getItem('theme');
                var isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var isDark = theme === 'dark' || (theme === 'system' && isSystemDark) || (!theme && isSystemDark);
                
                var resolvedTheme = isDark ? 'dark' : 'light';
                document.documentElement.setAttribute('theme', resolvedTheme);
                
                if (isDark) {
                    document.documentElement.classList.add('dark-mode');
                }
            } catch (e) {}
        })();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">

    <section id="settings" class="section">
        <h2 class="section-title"><i class="fa-solid fa-gear"></i>Pengaturan</h2>

        <div class="settings-card">
            <div class="settings-header">
                <div class="settings-header-title">
                    <h3>Preferensi</h3>
                    <span>Sesuaikan tampilan & bahasa</span>
                </div>
                <a href="index.html" class="settings-back-btn">
                    <i class="fa-solid fa-arrow-left"></i> Kembali
                </a>
            </div>
            
            <div class="settings-container">
                <div class="setting-item">
                    <div class="setting-label">
                        <div class="setting-icon"><i class="fa-solid fa-palette"></i></div>
                        <div class="setting-text">
                            <label for="themeSelect">Tema Tampilan</label>
                            <span>Pilih mode terang atau gelap</span>
                        </div>
                    </div>
                    <div class="setting-control">
                        <select id="themeSelect" class="styled-select">
                            <option value="system">Sistem Default</option>
                            <option value="light">Terang</option>
                            <option value="dark">Gelap</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-icon"></i>
                    </div>
                </div>

                <div class="setting-item">
                    <div class="setting-label">
                        <div class="setting-icon"><i class="fa-solid fa-language"></i></div>
                        <div class="setting-text">
                            <label for="langSelect">Bahasa</label>
                            <span>Pilih bahasa antarmuka web</span>
                        </div>
                    </div>
                    <div class="setting-control">
                        <select id="langSelect" class="styled-select">
                            <option value="id">Indonesia</option>
                            <option value="en">English</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-icon"></i>
                    </div>

        </div>
