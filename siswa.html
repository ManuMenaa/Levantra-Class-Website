    <title>Levantra Student</title>

    <script>
        (function() {
            try {
                var theme = localStorage.getItem('theme');
                var isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var isDark = theme === 'dark' || (theme === 'system' && isSystemDark) || (!theme && isSystemDark);
                
                var resolvedTheme = isDark ? 'dark' : 'light';
                document.documentElement.setAttribute('theme', resolvedTheme);
                
                if (isDark) {
                    document.documentElement.classList.add('dark-mode');
                }
            } catch (e) {}
        })();
    </script>
    <script type="module" src="/src/js/app.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="/src/css/all.min.css">
    <link rel="stylesheet" href="/src/css/style.css">
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>
    <div class="black-overlay" onclick="closeMenu()"></div>
    <nav>
        <div class="logo-container">
            <img src="/img/LevantraLogo.jpg" alt="Logo Levantra" class="logo-img" width="50" height="50">
            <span class="logo-text">LEVANTRA</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html#beranda" onclick="closeMenu()"><i class="fa-solid fa-home nav-icon"></i>Beranda</a></li>
            <li><a href="index.html#pengurus" onclick="closeMenu()"><i class="fa-solid fa-sitemap nav-icon"></i>Pengurus</a></li>
            <li><a href="siswa.html" onclick="closeMenu()"><i class="fa-solid fa-user-group nav-icon"></i>Siswa</a></li>
            <li><a href="index.html#jadwal" onclick="closeMenu()"><i class="fa-solid fa-calendar-alt nav-icon"></i>Jadwal</a></li>
            <li><a href="index.html#kas" onclick="closeMenu()"><i class="fa-solid fa-money-check-alt nav-icon"></i>Kas</a></li>
            <li><a href="index.html#momen" onclick="closeMenu()"><i class="fa-solid fa-camera nav-icon"></i>Momen</a></li>
        </ul>
        <div class="nav-actions">
            <div class="account-menu-wrapper">
                <button id="accountButton" class="account-menu-toggle" onclick="toggleAccountMenu()">
                    <i id="accountIcon" class="fa-regular fa-circle-user"></i>
                </button>
                <div id="accountMenu" class="account-menu">
                    <a id="loginMenuItem" onclick="login(); closeAccountMenu()">
                        <i class="fa-solid fa-right-to-bracket"></i>Masuk
                    </a>
                    <a href="settings.html">
                        <i class="fa-solid fa-gear"></i>Settings
                    </a>
                    <a id="logoutMenuItem" onclick="logout(); closeAccountMenu()" hidden>
                        <i class="fa-solid fa-right-from-bracket"></i>Keluar
                    </a>
                </div>
            </div>
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <section class="section">
        <h2 class="section-title"><i class="fa-solid fa-user-group"></i>Daftar Siswa</h2>
        <div class="student-grid" id="studentGrid">
        </div>
    </section>

    <div id="studentModal" class="black-overlay" onclick="closeModal('studentModal', event)">
        <div class="modal-content detail-content" onclick="event.stopPropagation()">
            <button class="close-btn detail-close" onclick="closeModal('studentModal')">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="detail-left">
                <div class="detail-slider">
                    <img id="modalStudentAvatar" src="/img/LevantraLogo.jpg" alt="Foto Siswa" class="student-avatar" style="width: 100%; max-height: 80vh; object-fit: contain;">
                </div>
            </div>
            <div class="detail-right">
                <div class="detail-info">
                    <span class="modal-badge" style="display:inline-block; margin-bottom: 10px;">Profil Siswa</span>
                    <h3 id="modalStudentName" style="font-size: 1.5rem; margin-bottom: 5px;">Nama Siswa</h3>
                    <p id="modalStudentNickname" style="color: var(--text-muted); font-size: 1rem; margin-bottom: 5px; font-weight: 600;">Nama Panggilan: -</p>
                    <p id="modalStudentAbsent" style="color: var(--text-muted); font-size: 1rem;">No. Absen: <strong id="modalStudentAbsentStrong">-</strong></p>
                </div>
            </div>
        </div>
    </div>
</body>
